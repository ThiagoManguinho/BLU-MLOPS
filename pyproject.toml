[project]
name = "blu-service"
version = "0.1.0"
description = "Serviço de inferência BLU: detecção do estado de vagas de estacionamento (LIVRE/OCUPADA) a partir de imagem, via YOLOv8-OBB servido com BentoML."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bentoml>=1.3,<2",
    "ultralytics>=8.3,<9",
    "torch>=2.2,<3",
    "pillow>=10.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.uv]
# Usa exclusivamente o Python já instalado na máquina: o uv nunca baixa um
# interpretador próprio nem usa um que ele tenha baixado antes.
# Qualquer Python >= 3.11 serve (ver requires-python acima).
python-downloads = "never"
python-preference = "only-system"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blu_service"]
